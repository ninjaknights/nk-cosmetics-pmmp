# Managed by BedrockNexus Plugins. Builds every branch push and uploads the
# "plugin-package" artifact; BedrockNexus publishes approved releases.
name: BedrockNexus Publish

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: bedrocknexus-publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP for PocketMine-MP 5
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: "8.2"
          install-path: "../bin"

      - name: Check PHP syntax
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Download Pharynx
        env:
          PHARYNX_URL: https://github.com/BedrockNexus/pharynx/releases/download/0.4.0-bedrocknexus.1/pharynx.phar
          PHARYNX_SHA256: f72d7566db0fe0197e2fefff0b88798b52758066f678a3c2d6e934dad277b79a
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pharynx.phar" "$PHARYNX_URL"
          echo "$PHARYNX_SHA256  $RUNNER_TEMP/pharynx.phar" | sha256sum -c -

      # With a composer.json, Pharynx runs composer install and bundles the
      # dependencies under the plugin's namespace, leaving out the server.
      - name: Build Phar
        run: php "$RUNNER_TEMP/pharynx.phar" -i . -p="dist/NKCosmetics.phar"

      - name: Upload plugin for BedrockNexus
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: dist/NKCosmetics.phar
          if-no-files-found: error
