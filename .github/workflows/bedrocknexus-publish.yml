# Managed by BedrockNexus Plugins. Builds every branch push and uploads the
# "plugin-package" artifact; BedrockNexus publishes approved releases.
name: BedrockNexus Publish

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: bedrocknexus-publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP for PocketMine-MP 5
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: "8.2"
          install-path: "../bin"

      - name: Check PHP syntax
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install Composer dependencies
        if: hashFiles('composer.json') != ''
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist

      - name: Build Phar
        id: pharynx
        uses: SOF3/pharynx@v0.2
        with:
          pharynx-version: "0.3.8"
          composer: ${{ hashFiles('composer.json') != '' }}
          stage-poggit: "false"

      - name: Name the plugin file
        env:
          OUTPUT_PHAR: ${{ steps.pharynx.outputs.output-phar }}
        run: |
          mkdir dist
          cp "$OUTPUT_PHAR" "dist/NKCosmetics.phar"

      - name: Upload plugin for BedrockNexus
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: dist/NKCosmetics.phar
          if-no-files-found: error
